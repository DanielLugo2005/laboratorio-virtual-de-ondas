name: Publicar laboratorio en GitHub Pages

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Confirmo que autorizo hacer públicos el sitio, el código y los videos'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.publicar == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Instalar gestor fijado
        run: npm install --global pnpm@11.25.0
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Pruebas físicas y rutas
        run: pnpm test
      - name: Validar videos y compilar
        run: pnpm build
      - name: Comprobar integridad multimedia de dist
        run: node scripts/check-media.mjs --dist
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    if: ${{ inputs.publicar == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar versión verificada
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
